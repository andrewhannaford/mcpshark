title: MCP Tool Call Targeting Credential File Paths
id: b2c8d7e6-9f1a-0b2c-3d4e-5f6a7b8c9d0e
status: stable
description: |
    Detects tools/call requests where the tool arguments reference common
    credential file paths. An attacker who has established tool access can
    instruct the LLM to invoke file-reading tools against sensitive targets.

    High-value targets include:
      - ~/.ssh/id_rsa, ~/.ssh/id_ed25519 (SSH private keys)
      - ~/.aws/credentials, ~/.aws/config (AWS credentials)
      - ~/.config/gcloud/application_default_credentials.json (GCP)
      - /etc/passwd, /etc/shadow (Unix credential stores)
      - .env files (API keys in dotenv format)
      - ~/.npmrc, ~/.pypirc (package registry tokens)

    This is a post-compromise signal — the attacker already has tool access.
    Correlate with injection detections to identify the injection vector.
references:
    - https://attack.mitre.org/techniques/T1552/
    - https://atlas.mitre.org/techniques/AML.T0054
author: Andrew Hannaford (@andrewhannaford)
date: 2026-05-24
tags:
    - attack.T1552      # ATT&CK: Unsecured Credentials
    - attack.T1083      # ATT&CK: File and Directory Discovery
    - attack.AML.T0054  # ATLAS: LLM Prompt Injection
logsource:
    product: mcpshark
    category: mcp_traffic
detection:
    selection:
        mcp.method: 'tools/call'
        mcp.direction: 'client_to_server'
    credential_paths:
        payload.params_redacted|contains:
            - '.ssh/id_rsa'
            - '.ssh/id_ed25519'
            - '.aws/credentials'
            - 'application_default_credentials'
            - '/etc/passwd'
            - '/etc/shadow'
            - '.npmrc'
            - '.pypirc'
    condition: selection and credential_paths
fields:
    - mcp.server_name
    - mcp.tool_name
    - mcp.server_identity_sha256
    - session.id
    - payload.params_sha256
    - payload.params_redacted
falsepositives:
    - Security auditing tools explicitly configured to check credential hygiene
    - Developers who have authorized their AI assistant to manage SSH keys
level: high
