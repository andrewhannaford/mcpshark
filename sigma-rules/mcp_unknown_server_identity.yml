title: MCP Server Identity Not in Allowlist
id: c3d9e8f7-0a2b-1c3d-4e5f-6a7b8c9d0e1f
status: experimental
description: |
    Detects MCP server sessions where the server binary hash does not appear in
    the configured allowlist. Unknown servers may be:
      - Malicious servers installed as supply-chain attacks
      - Compromised or tampered versions of trusted servers
      - Legitimate but unapproved servers introduced without review

    Requires mcpshark to be run with --allowlist pointing to a YAML file
    containing the SHA-256 digests of approved server binaries. Events without
    server_identity_sha256 (e.g. script interpreters resolved via PATH) are
    lower confidence.

    Enable allowlist enforcement with --allowlist path/to/allowlist.yaml.
    See docs/allowlist.md for format.
references:
    - https://attack.mitre.org/techniques/T1195/
    - https://atlas.mitre.org/techniques/AML.T0051
author: Andrew Hannaford (@andrewhannaford)
date: 2026-05-24
tags:
    - attack.T1195      # ATT&CK: Supply Chain Compromise
    - attack.AML.T0051  # ATLAS: LLM Plugin Compromise
logsource:
    product: mcpshark
    category: mcp_traffic
detection:
    selection:
        detections|contains:
            - 'mcp.allowlist'
    condition: selection
fields:
    - mcp.server_name
    - mcp.server_identity_sha256
    - session.id
falsepositives:
    - Newly approved servers not yet added to the allowlist
    - Development builds of known-good servers (allowlist by path prefix instead)
level: high
