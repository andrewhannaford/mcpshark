# mcpshark props.conf
# Configures Splunk to parse mcpshark OCSF JSON-L event files.
#
# To ingest:
#   - Point a monitor stanza at the mcpshark output file (see inputs.conf.example)
#   - Or pipe: mcpshark run -- <server> | logger -t mcpshark
#
# Recommended sourcetype for file monitors: mcpshark

[mcpshark]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
CHARSET = UTF-8
category = Custom
description = mcpshark MCP security event stream (OCSF JSON-L)
pulldown_type = true
KV_MODE = none
INDEXED_EXTRACTIONS = json

# Top-level timestamp from the ts field (RFC3339Nano)
TIME_PREFIX = "ts"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9N%Z
MAX_TIMESTAMP_LOOKAHEAD = 35

# --- Field aliases: map OCSF paths to Splunk-friendly names ---

FIELDALIAS-server_name       = mcp.server_name       AS mcp_server_name
FIELDALIAS-server_hash       = mcp.server_identity_sha256 AS mcp_server_sha256
FIELDALIAS-direction         = mcp.direction         AS mcp_direction
FIELDALIAS-method            = mcp.method            AS mcp_method
FIELDALIAS-tool_name         = mcp.tool_name         AS mcp_tool_name
FIELDALIAS-resource_uri      = mcp.resource_uri      AS mcp_resource_uri
FIELDALIAS-transport         = mcp.transport         AS mcp_transport
FIELDALIAS-outcome           = mcp.outcome           AS mcp_outcome
FIELDALIAS-session_id        = session.id            AS mcp_session_id
FIELDALIAS-protocol_version  = session.mcp_protocol_version AS mcp_protocol_version
FIELDALIAS-host_name         = host.name             AS mcp_host
FIELDALIAS-user_name         = user.name             AS mcp_user
FIELDALIAS-params_sha256     = payload.params_sha256 AS mcp_params_sha256
FIELDALIAS-params_size       = payload.params_size_bytes AS mcp_params_size_bytes
FIELDALIAS-ocsf_class        = ocsf.class_uid        AS ocsf_class_uid
FIELDALIAS-ocsf_severity     = ocsf.severity_id      AS ocsf_severity_id

# Splunk CIM: map to common fields for Technology Add-On compatibility
FIELDALIAS-cim_src_host  = host.name  AS src_host
FIELDALIAS-cim_user      = user.name  AS user
FIELDALIAS-cim_action    = mcp.outcome AS action
FIELDALIAS-cim_app       = mcp.server_name AS app

[source::...mcpshark*.jsonl]
sourcetype = mcpshark

[source::...mcpshark*.log]
sourcetype = mcpshark
