# mcpshark transforms.conf
# Lookups and field transformations for the mcpshark Splunk app.

# --- Severity lookup: map detection severity strings to numeric levels ---
[mcpshark_severity_lookup]
filename = mcpshark_severity.csv
default_match = true
min_matches = 1
max_matches = 1

# --- Rule description lookup: map rule_id to human-readable names ---
[mcpshark_rules_lookup]
filename = mcpshark_rules.csv
default_match = true
min_matches = 1
max_matches = 1

# --- Extract detection array fields ---
# Detections is a JSON array; extract the first detection's fields.
[mcpshark_extract_first_detection]
SOURCE_KEY = detections
REGEX = "rule_id"\s*:\s*"(?P<detection_rule_id>[^"]+)"
FORMAT = detection_rule_id::$1

[mcpshark_extract_detection_severity]
SOURCE_KEY = detections
REGEX = "severity"\s*:\s*"(?P<detection_severity>[^"]+)"
FORMAT = detection_severity::$1

[mcpshark_extract_detection_confidence]
SOURCE_KEY = detections
REGEX = "confidence"\s*:\s*(?P<detection_confidence>[\d.]+)
FORMAT = detection_confidence::$1

[mcpshark_extract_detection_atlas]
SOURCE_KEY = detections
REGEX = "atlas"\s*:\s*"(?P<detection_atlas>[^"]+)"
FORMAT = detection_atlas::$1

[mcpshark_extract_detection_attck]
SOURCE_KEY = detections
REGEX = "attck"\s*:\s*"(?P<detection_attck>[^"]+)"
FORMAT = detection_attck::$1
