# mcpshark eventgen.conf
# Sample event generation for Splunk eventgen (SA-Eventgen).
# Generates realistic mcpshark events for dashboard development and demos.

[mcpshark_sample.jsonl]
sourcetype = mcpshark
source = mcpshark_sample.jsonl
index = main
interval = 10
count = 5
earliest = -5m
latest = now
outputMode = spool
spoolDir = $SPLUNK_HOME/var/spool/splunk

# Token substitution: randomize session IDs and timestamps
token.0.token = ##SESSION##
token.0.replacementType = random
token.0.replacement = guid

token.1.token = ##SERVER##
token.1.replacementType = list
token.1.replacement = ["filesystem","github","brave-search","postgres","my-internal-server"]

token.2.token = ##USER##
token.2.replacementType = list
token.2.replacement = ["alice","bob","carol","dave"]

token.3.token = ##HOST##
token.3.replacementType = list
token.3.replacement = ["dev-mac-01","dev-mac-02","eng-laptop-07","sec-ws-01"]
