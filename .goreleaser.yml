version: 2

project_name: mcpshark

before:
  hooks:
    - go mod tidy

builds:
  - id: mcpshark
    main: ./cmd/mcpshark
    binary: mcpshark
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: mcpshark
    builds:
      - mcpshark
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

brews:
  - name: mcpshark
    repository:
      owner: andrewhannaford
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/andrewhannaford/mcpshark"
    description: "Wireshark for the AI tool layer — transparent MCP proxy with runtime detection"
    license: "Apache-2.0"
    dependencies:
      - name: go
        type: build
    test: |
      assert_match version.to_s, shell_output("#{bin}/mcpshark version 2>&1")
    install: |
      system "go", "build",
             *std_go_args(ldflags: "-s -w -X main.version=#{version}"),
             "./cmd/mcpshark"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: andrewhannaford
    name: mcpshark
  draft: false
  prerelease: auto
  name_template: "mcpshark {{.Version}}"
